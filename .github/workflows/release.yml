name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must point at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Trusted publishing needs npm >= 11.5.1
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tag must match package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          for p in packages/mcp packages/opencode-plugin; do
            test "$(node -p "require('./$p/package.json').version")" = "$v"
          done
      - run: pnpm build
      - name: Check npm tarballs
        run: |
          mkdir pack
          pnpm -C packages/mcp pack --pack-destination ../../pack
          pnpm -C packages/opencode-plugin pack --pack-destination ../../pack
          node scripts/check-pack.mjs pack/*.tgz
      - name: Publish to npm
        run: |
          (cd packages/mcp && npm publish)
          (cd packages/opencode-plugin && npm publish)
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
